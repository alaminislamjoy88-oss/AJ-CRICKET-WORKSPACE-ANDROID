name: Build AJ Cricket APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'AJ_CRICKET_WORKSPACE_ANDROID_PROJECT.zip'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        run: | unzip -q AJ_CRICKET_WORKSPACE_ANDROID_PROJECT.zip -d extracted cd extracted/AJ_CRICKET_WORKSPACE_ANDROID echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"       - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: cd "$PROJECT_DIR" && gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AJ-CRICKET-WORKSPACE-APK
          path: extracted/AJ_CRICKET_WORKSPACE_ANDROID/app/build/outputs/apk/debug/app-debug.apk
