name: Build AJ Cricket APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AJ_CRICKET_WORKSPACE_ANDROID_PROJECT.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          unzip -q AJ_CRICKET_WORKSPACE_ANDROID_PROJECT.zip -d extracted
          ls -la extracted

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: extracted/AJ_CRICKET_WORKSPACE_ANDROID
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AJ-CRICKET-WORKSPACE-APK
          path: extracted/AJ_CRICKET_WORKSPACE_ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
